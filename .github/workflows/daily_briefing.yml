name: Daily Stock Briefing

on:
  schedule:
    # 8:00 AM US Eastern = 12:00 UTC (EDT, Mar–Nov) / 13:00 UTC (EST, Nov–Mar)
    # Using 12:00 UTC — covers EDT. Adjust to "0 13 * * 1-5" in winter if needed.
    - cron: "0 12 * * 1-5"   # Monday–Friday only

  workflow_dispatch:          # Allows you to trigger a test run manually from GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files in repo (debug)
        run: |
          echo "=== Files in repo root ==="
          ls -la
          echo "=== Checking for daily_briefing.py ==="
          find . -name "*.py" | head -20

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic yfinance requests
          echo "=== Installed packages ==="
          pip list | grep -E "anthropic|yfinance|requests"

      - name: Run daily stock briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:     ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python daily_briefing.py
