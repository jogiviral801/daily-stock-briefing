name: Daily Stock Briefing

on:
  schedule:
    # 8:00 AM US Eastern = 12:00 UTC (EDT, Mar–Nov) / 13:00 UTC (EST, Nov–Mar)
    # Using 12:00 UTC — covers EDT. Adjust to "0 13 * * 1-5" in winter if needed.
    - cron: "0 12 * * 1-5"   # Monday–Friday only

  workflow_dispatch:          # Allows you to trigger a test run manually from GitHub

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily stock briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:     ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python daily_briefing.py
